[package]
name = "review-tool"
version = "0.3.0"
edition = "2021"
description = "Review GitHub pull requests with real code intelligence"

[lib]
name = "review_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["process", "io-util", "sync", "fs", "macros", "rt-multi-thread"] }
regex = "1"
libc = "0.2"
portable-pty = "0.9"

[profile.release]
strip = true
lto = true
