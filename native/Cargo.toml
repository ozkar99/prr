[package]
name = "review-tool-native"
version = "0.4.0"
edition = "2021"
description = "Review GitHub pull requests with real code intelligence (native Rust UI)"

[[bin]]
name = "review-tool"
path = "src/main.rs"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12" }
# Platform layer (macOS window, Metal renderer). runtime_shaders: compile Metal shaders at
# launch, so building doesn't need Xcode's `metal` compiler.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["runtime_shaders", "font-kit"] }
gpui-component = { version = "=0.10.0", features = ["tree-sitter-go", "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-python", "tree-sitter-bash", "tree-sitter-markdown", "tree-sitter-markdown-inline"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["process", "io-util", "sync", "fs", "macros", "rt-multi-thread", "time"] }
regex = "1"
libc = "0.2"
futures = "0.3"

[profile.release]
strip = true
lto = "thin"
