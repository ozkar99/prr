[package]
name = "review-tool-native"
version = "0.4.0"
edition = "2024"
description = "Review GitHub pull requests with real code intelligence (native Rust UI)"

[[bin]]
name = "review-tool"
path = "src/main.rs"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12" }
# Platform layer (macOS window, Metal renderer). runtime_shaders: compile Metal shaders at
# launch, so building doesn't need Xcode's `metal` compiler.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["runtime_shaders", "font-kit"] }
gpui-base = "=0.10.0"
gpui-component = { version = "=0.10.0", features = ["tree-sitter-go", "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-python", "tree-sitter-bash", "tree-sitter-markdown", "tree-sitter-markdown-inline"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["process", "io-util", "sync", "fs", "macros", "rt-multi-thread", "time"] }
regex = "1"
libc = "0.2"
futures = "0.3"
# Used by the vendored diff view (src/diffview).
smallvec = "1.16.6"
unicode-segmentation = "1.13.3"
similar = "2.7.0"
# Dev test driver (src/devdriver.rs): the window number for screenshots.
objc = "0.2.7"
raw-window-handle = "0.6.2"
unicode-width = "0.2.3"
# Syntax highlighting: same grammar versions gpui-component compiles, with our own
# queries mapped to VS Code Dark Modern colors (see src/highlight.rs).
tree-sitter = "=0.26.13"
tree-sitter-highlight = "=0.26.13"
tree-sitter-go = "=0.23.4"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-python = "=0.23.6"
tree-sitter-bash = "=0.23.3"
alacritty_terminal = "=0.26.0"

[profile.release]
strip = true
lto = "thin"
